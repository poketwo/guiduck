[project]
name = "poketwo-support"
version = "0.1.0"
description = ""
authors = [{name = "Oliver Ni", email = "oliver.ni@gmail.com"}]
requires-python = ">=3.10,<4"
dependencies = [
    "motor>=3.5.0,<4",
    "jishaku",
    "discord-ext-menus",
    "dnspython>=2.0.0,<3",
    "discord-ext-events",
    "durations-nlp>=1.0.1,<2",
    "aioredis>=1.3.1,<2",
    "discord-ext-menus-views",
    "python-dateutil>=2.8.2,<3",
    "parsedatetime>=2.6,<3",
    "discord-py",
    "httpx>=0.25.0,<0.26",
    "authlib>=1.2.1,<2",
    "cryptography>=46.0,<47",
]

[dependency-groups]
dev = [
    "black>=22.3.0,<23",
]

[tool.uv.sources]
jishaku = {git = "https://github.com/Gorialis/jishaku.git", rev = "0abbb363433c306f8e3cb77a0ffc98948bd2c535"}
discord-ext-menus = {git = "https://github.com/Rapptz/discord-ext-menus.git", rev = "8686b5d1bbc1d3c862292eb436ab630d6e9c9b53"}
discord-ext-events = {git = "https://github.com/oliver-ni/discord-ext-events", rev = "a91ba6441705bc2a319a387cfbc139cc2e8c1472"}
discord-ext-menus-views = {git = "https://github.com/oliver-ni/discord-ext-menus-views.git", rev = "a472f3de648eb9e0fcffc2e101c69841de92f3ff"}
discord-py = {git = "https://github.com/Rapptz/discord.py.git", rev = "3270121c8098539fa8420ce89104943e3adb88e2"}

[tool.black]
line-length = 120
